<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Dele Dana</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #222222;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header {
            margin-top: 20px;
        }
        h1 {
            color: #d32f2f;
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            font-size: 15px;
            color: #555555;
            line-height: 1.4;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            background-color: #d32f2f;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Spanish Dele Dana 🇪🇸</h1>
        <p>Онлайн-школа іспанської мови Богдани Пономарьової</p>
    </div>
    
    <button class="btn" onclick="Telegram.WebApp.close()">Записатися на пробний урок</button>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
