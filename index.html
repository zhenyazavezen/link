<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram — Евгений Завезен</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #1a1a1a;
      padding: 30px 20px;
      border-radius: 20px;
      max-width: 340px;
      width: 100%;
      border: 1px solid #2a2a2a;
    }
    h2 { margin: 0 0 10px 0; font-size: 20px; }
    p { color: #8e8e93; font-size: 14px; margin-bottom: 25px; line-height: 1.4; }
    .btn {
      display: block;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      padding: 15px;
      border-radius: 12px;
    }
    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Евгений Завезен</h2>
    <p>Нажмите на кнопку ниже, чтобы открыть профиль в приложении Instagram</p>
    
    <a id="instaBtn" class="btn" href="#">Перейти в Instagram</a>

    <div class="hint">
      Если приложение не открылось автоматически, нажмите <b>⋮</b> вверху экрана и выберите <b>«Открыть в браузере»</b>.
    </div>
  </div>

  <script>
    const username = "zhenya_zavezen";
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const btn = document.getElementById("instaBtn");

    if (isAndroid) {
      // Для Android: правильная прямая команда для открытия приложения
      btn.href = `intent://instagram.com/_u/${username}/#Intent;package=com.instagram.android;scheme=https;end`;
    } else if (isiOS) {
      // Для iPhone
      btn.href = `instagram://user?username=${username}`;
    } else {
      // Для ПК и обычных браузеров
      btn.href = `https://www.instagram.com/${username}/`;
    }
  </script>

</body>
</html>
