<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Instagram</title>
<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at 50% 0%, #a3a3a3 0%, #8a8a8a 45%, #6e6e6e 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
    }

    .btn {
        display: block;
        width: 100%;
        max-width: 320px;
        padding: 18px;
        border-radius: 14px;
        background: linear-gradient(155deg, #3d3d3d 0%, #262626 100%);
        color: #ffffff;
        text-decoration: none;
        font-size: 17px;
        font-weight: 700;
        text-align: center;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        transition: transform 0.1s ease;
    }

    .btn:active {
        transform: scale(0.98);
    }
</style>
</head>
<body>

    <a class="btn" href="https://www.instagram.com/zhenya_zavezen" target="_blank" rel="noopener">Открыть в Instagram</a>

</body>
</html>
