<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #0c0c0e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #18181c;
      border: 1px solid #2a2a32;
      border-radius: 20px;
      padding: 30px 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
    }
    p {
      color: #8e8e93;
      font-size: 14px;
      margin: 0 0 24px 0;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(220, 39, 67, 0.4);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: #777788;
      line-height: 1.4;
    }
    .hint b {
      color: #aaaaff;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Переход в Instagram</h2>
    <p>Нажмите на кнопку ниже, чтобы открыть профиль</p>

    <a id="instaBtn" class="btn" href="https://www.instagram.com/zhenya_zavezen/">Открыть Instagram</a>

    <div class="hint">
      Если открылся сайт: нажмите <b>⋮</b> (три точки) вверху экрана и выберите <b>«Открыть в браузере»</b>.
    </div>
  </div>

  <script>
    const username = "zhenya_zavezen";
    const btn = document.getElementById("instaBtn");

    const isAndroid = /Android/i.test(navigator.userAgent);
    const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isAndroid) {
      // Прямой вызов приложения для Android
      btn.href = `intent://instagram.com/_u/${username}/#Intent;package=com.instagram.android;scheme=https;end`;
    } else if (isiOS) {
      // Прямой вызов приложения для iPhone
      btn.href = `instagram://user?username=${username}`;
    }
  </script>

</body>
</html>
